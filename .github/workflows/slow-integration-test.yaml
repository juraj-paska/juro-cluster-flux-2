name: Integration Test Suite

on:
  pull_request:
    branches: [main]

jobs:
  setup:
    name: Setup Test Environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Simulate environment provisioning
        run: |
          echo "=== Provisioning test environment ==="
          echo "Pulling required container images..."
          sleep 30
          echo "[OK] Images pulled"

          echo ""
          echo "Initializing test cluster state..."
          sleep 20
          echo "[OK] Cluster state initialized"

      - name: Run namespace isolation checks
        run: |
          echo "=== Namespace Isolation Checks ==="
          sleep 15

          # Extract all namespaces from manifests
          echo "Scanning manifests for namespace declarations..."
          namespaces=$(grep -rh 'namespace:' app/ cluster-flux/ --include='*.yaml' --include='*.yml' 2>/dev/null | \
            sed 's/.*namespace:\s*//' | sed 's/#.*//' | tr -d ' "' | sort -u | grep -v '^$')

          echo "Found namespaces:"
          echo "$namespaces" | while read ns; do
            echo "  - $ns"
          done

          echo ""
          echo "[OK] Namespace isolation check passed"

      - name: Run resource budget simulation
        run: |
          echo "=== Resource Budget Simulation ==="
          sleep 20

          echo "Collecting resource requests from all deployments..."
          total_cpu_milli=0
          total_mem_mi=0

          for f in $(find app/ -name 'deployment.yaml' -o -name 'http1.yaml'); do
            echo "  Scanning: $f"
            cpu=$(grep -A1 'requests:' "$f" | grep 'cpu:' | head -1 | sed 's/[^0-9]//g')
            mem=$(grep -A2 'requests:' "$f" | grep 'memory:' | head -1 | sed 's/[^0-9]//g')
            if [ -n "$cpu" ]; then
              total_cpu_milli=$((total_cpu_milli + cpu))
            fi
            if [ -n "$mem" ]; then
              total_mem_mi=$((total_mem_mi + mem))
            fi
          done

          echo ""
          echo "Total CPU requested: ${total_cpu_milli}m"
          echo "Total Memory requested: ${total_mem_mi}Mi"

          # Simulate a cluster budget of 2000m CPU and 2048Mi memory
          if [ "$total_cpu_milli" -gt 2000 ]; then
            echo "[FAIL] CPU requests (${total_cpu_milli}m) exceed cluster budget (2000m)"
            exit 1
          fi

          if [ "$total_mem_mi" -gt 2048 ]; then
            echo "[FAIL] Memory requests (${total_mem_mi}Mi) exceed cluster budget (2048Mi)"
            exit 1
          fi

          echo "[OK] Resource budget within limits"

      - name: Run deployment readiness checks
        run: |
          echo "=== Deployment Readiness Checks ==="
          sleep 15

          echo "Checking all deployments have required labels..."
          fail=0
          for f in $(find app/base -name 'deployment.yaml' -o -name 'http1.yaml'); do
            name=$(grep -A1 'metadata:' "$f" | grep 'name:' | head -1 | awk '{print $2}')
            has_app_label=$(grep -c 'app:' "$f" || true)
            if [ "$has_app_label" -lt 1 ]; then
              echo "[FAIL] Deployment '$name' in $f is missing 'app' label"
              fail=1
            else
              echo "[PASS] Deployment '$name' has required labels"
            fi
          done

          if [ "$fail" -eq 1 ]; then
            exit 1
          fi

          echo ""
          echo "[OK] All deployment readiness checks passed"

      - name: Final summary
        run: |
          echo "=== Integration Test Summary ==="
          echo "All checks passed successfully."
          echo "Total simulated time: ~2 minutes"
