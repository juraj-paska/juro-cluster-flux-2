name: Kustomize Build

on:
  pull_request:
    branches: [main]

jobs:
  kustomize-build:
    name: Build Kustomize Overlays
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kustomize
        run: |
          curl -sL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Build all kustomize targets
        run: |
          echo "=== Kustomize Build Validation ==="
          echo ""

          exit_code=0

          for kust_file in $(find . -name 'kustomization.yaml' -type f \
            -not -path './.github/*' \
            -not -path './cluster-flux/flux-system/*'); do
            dir=$(dirname "$kust_file")
            echo "--- Building: $dir ---"

            if output=$(kustomize build "$dir" 2>&1); then
              resource_count=$(echo "$output" | grep -c '^kind:' || true)
              echo "[PASS] Build succeeded ($resource_count resources)"
            else
              echo "[FAIL] Build failed for $dir"
              echo "$output"
              exit_code=1
            fi
            echo ""
          done

          if [ "$exit_code" -ne 0 ]; then
            echo "=== KUSTOMIZE BUILD FAILED ==="
            exit 1
          fi

          echo "=== All kustomize builds passed ==="
