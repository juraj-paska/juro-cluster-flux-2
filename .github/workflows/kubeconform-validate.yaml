name: Kubernetes Schema Validation

on:
  pull_request:
    branches: [main]

jobs:
  kubeconform:
    name: Validate K8s Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | \
            tar xz -C /usr/local/bin

      - name: Install kustomize
        run: |
          curl -sL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Validate kustomize build output
        run: |
          echo "=== Validating Kustomize Build Output ==="
          echo ""

          exit_code=0

          for kust_file in $(find . -name 'kustomization.yaml' -type f \
            -not -path './.github/*' \
            -not -path './cluster-flux/flux-system/*'); do
            dir=$(dirname "$kust_file")
            echo "--- Validating: $dir ---"

            if ! build_output=$(kustomize build "$dir" 2>&1); then
              echo "[SKIP] Kustomize build failed for $dir (reported by kustomize-build workflow)"
              echo ""
              continue
            fi

            if ! echo "$build_output" | kubeconform -strict -summary \
              -output text \
              -kubernetes-version 1.28.0; then
              exit_code=1
            fi

            echo ""
          done

          if [ "$exit_code" -ne 0 ]; then
            echo ""
            echo "[FAIL] Some kustomize outputs have schema validation errors"
            exit 1
          fi

          echo "[PASS] All kustomize outputs are valid"

      - name: Check for common K8s misconfigurations
        run: |
          echo "=== Common Misconfiguration Checks ==="
          echo ""

          exit_code=0

          # Check: containers should have resource limits
          echo "--- Check: Resource limits defined ---"
          for f in $(find app/base -name 'deployment.yaml' -o -name 'statefulset.yaml'); do
            name=$(grep -A1 'metadata:' "$f" | grep 'name:' | head -1 | awk '{print $2}')
            if ! grep -q 'limits:' "$f"; then
              echo "[WARN] Workload '$name' in $f has no resource limits"
            else
              echo "[PASS] Workload '$name' has resource limits"
            fi
          done

          echo ""

          # Check: container ports match service targetPort
          echo "--- Check: Port consistency ---"
          for base_dir in app/base/*/; do
            deploy_file=""
            svc_file="$base_dir/service.yaml"

            for candidate in deployment.yaml statefulset.yaml; do
              if [ -f "$base_dir/$candidate" ]; then
                deploy_file="$base_dir/$candidate"
                break
              fi
            done

            if [ -n "$deploy_file" ] && [ -f "$svc_file" ]; then
              container_port=$(grep 'containerPort:' "$deploy_file" 2>/dev/null | head -1 | grep -oE '[0-9]+')
              target_port=$(grep 'targetPort:' "$svc_file" 2>/dev/null | head -1 | grep -oE '[0-9]+')

              app_name=$(basename "$base_dir")

              if [ -n "$container_port" ] && [ -n "$target_port" ]; then
                if [ "$container_port" != "$target_port" ]; then
                  echo "[FAIL] Port mismatch in '$app_name': containerPort=$container_port but service targetPort=$target_port"
                  exit_code=1
                else
                  echo "[PASS] Ports consistent for '$app_name' (port $container_port)"
                fi
              fi
            fi
          done

          echo ""

          if [ "$exit_code" -ne 0 ]; then
            echo "=== VALIDATION FAILED ==="
            exit 1
          fi

          echo "=== All misconfiguration checks passed ==="
